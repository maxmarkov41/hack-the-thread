<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack The Thread - Explorer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.3/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.3/brython_stdlib.js"></script>
</head>

<body onload="brython()" class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-2">
                Hack The Thread
            </h1>
            <p class="text-gray-500">Explore, filter, and query your processed content.</p>
        </header>

        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search titles or summaries..." 
                class="w-full sm:w-2/3 p-3 rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <select 
                id="tag-filter" 
                class="w-full sm:w-1/3 p-3 rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
            >
                <option value="all">All Tags</option>
            </select>
        </div>

        <div class="flex flex-col lg:flex-row items-center justify-between gap-4 mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
                <span class="font-bold text-gray-700 whitespace-nowrap">Query by Date:</span>
                <input type="datetime-local" id="start-date" class="p-2 border border-gray-300 rounded-md w-full sm:w-auto focus:ring-2 focus:ring-blue-500">
                <span class="text-gray-500 font-medium">to</span>
                <input type="datetime-local" id="end-date" class="p-2 border border-gray-300 rounded-md w-full sm:w-auto focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="flex gap-2 w-full lg:w-auto">
                <button id="fetch-time-btn" class="w-full lg:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition-all shadow-sm">
                    Fetch Time Range
                </button>
                <button id="fetch-all-btn" class="w-full lg:w-auto bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-md transition-all shadow-sm">
                    Reset & Load All
                </button>
            </div>
        </div>

        <div id="loading" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        </div>
        <div id="error-message" class="hidden text-center text-red-500 font-semibold py-10"></div>

        <div id="card-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6"></div>

    </div>

    <script type="text/python">
        from browser import document, html, ajax, bind, window
        import json

        app_state = {
            "all_data": []
        }

        social_media_content_types = [
            "Vlogging & Day in the Life", "Parenting & Family", "Home Decor & DIY",
            "Minimalism & Intentional Living", "Fitness & Training", "Mental Health & Wellness",
            "Nutrition & Diet", "Beauty & Skincare", "Coding & Software Development",
            "Career & Productivity", "Language Learning", "Science & History",
            "Personal Finance", "Entrepreneurship & Startups", "Tech Reviews & Gadgets",
            "Culinary Arts & Baking", "Travel & Exploration", "Outdoor & Survival",
            "Photography & Videography", "Art & Illustration", "Music & Audio Production",
            "Gaming & Esports", "Comedy & Skits", "Literature", "Media Commentary",
            "Fashion & Style", "Event Announcements & Save-the-Dates",
            "Product Drops & Launch Teasers", "Industry News & Real-Time Updates",
            "Company Milestones & Celebrations", "Live Streams & Webinars",
            "Brain Teasers, Puzzles & Logic Problems", "Niche Problem Solving & Life Hacks",
            "Step-by-Step Tutorials & How-To Guides", "Infographics & Data Visualizations",
            "Myth Busting & Fact Checking", "Resource Roundups & Tool Recommendations",
            "Case Studies & Deep Dives", "Ask Me Anything (AMA) & Q&A Sessions",
            "Polls, Surveys & Quizzes", "Giveaways, Contests & Challenges",
            "User-Generated Content (UGC) Highlights", "Collaborations & Influencer Takeovers",
            "Customer Testimonials & Success Stories", "Behind the Scenes (BTS) & Bloopers",
            "Memes, GIFs & Trend Jacking", "Unboxings & First Impressions",
            "Before & After Transformations", "Inspirational Quotes & Motivational Speaking",
            "Hot Takes & Unpopular Opinions"
        ]

        def render_cards():
            search_text = document["search-input"].value.lower()
            selected_tag = document["tag-filter"].value
            
            grid = document["card-grid"]
            grid.clear()
            
            filtered_data = []
            for item in app_state["all_data"]:
                data = item.get("data", {})
                processed = item.get("processed_response", {})
                
                title = data.get("title", "").lower()
                summary = processed.get("summary", "").lower()
                tag = processed.get("autotag", "")
                
                match_search = search_text in title or search_text in summary
                match_tag = (selected_tag == "all") or (tag == selected_tag)
                
                if match_search and match_tag:
                    filtered_data.append(item)
                    
            if not filtered_data:
                grid <= html.DIV("No videos found matching your criteria.", Class="col-span-full text-center text-gray-500 py-10 text-lg")
                return
                
            for item in filtered_data:
                data = item.get("data", {})
                processed = item.get("processed_response", {})
                
                title = data.get("title", "Untitled")
                summary = processed.get("summary", "No summary available.")
                tag = processed.get("autotag", "Untagged")
                thumbnail = data.get("thumbnail") or "https://via.placeholder.com/640x360?text=No+Thumbnail"
                link = data.get("link", "#")
                
                card = html.A(
                    href=link, target="_blank", 
                    Class="bg-white rounded-2xl shadow-md overflow-hidden hover:-translate-y-1 hover:shadow-2xl transition-all duration-300 flex flex-col cursor-pointer group h-full"
                )
                
                img_container = html.DIV(Class="relative w-full pt-[56.25%] overflow-hidden bg-gray-200")
                img = html.IMG(src=thumbnail, alt=title, Class="absolute top-0 left-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500")
                
                def img_error(ev):
                    ev.target.src = "https://via.placeholder.com/640x360?text=Thumbnail+Unavailable"
                
                img.bind("error", img_error)
                img_container <= img
                card <= img_container
                
                content = html.DIV(Class="p-5 flex flex-col flex-grow")
                content <= html.SPAN(tag, Class="inline-block px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-full w-max mb-3 uppercase tracking-wide")
                content <= html.H2(title, Class="text-lg font-bold text-gray-900 mb-2")
                content <= html.P(summary, Class="text-sm text-gray-600 flex-grow")
                
                card <= content
                grid <= card

        def populate_tags():
            select = document["tag-filter"]
            for tag in social_media_content_types:
                select <= html.OPTION(tag, value=tag)

        @bind(document["search-input"], "input")
        def on_search(ev):
            render_cards()

        @bind(document["tag-filter"], "change")
        def on_filter(ev):
            render_cards()

        @bind(document["fetch-time-btn"], "click")
        def fetch_by_time(ev):
            start_val = document["start-date"].value
            end_val = document["end-date"].value
            
            if not start_val:
                window.alert("Please select at least a start date to query the API.")
                return
                
            js_date = window.Date.new
            start_ms = js_date(start_val).getTime()
            
            start_ns = int(start_ms * 1_000_000)
            url = f"http://127.0.0.1:5000/api/data/time?start={start_ns}"
            
            if end_val:
                end_ms = js_date(end_val).getTime()
                end_ns = int(end_ms * 1_000_000)
                url += f"&end={end_ns}"
                
            fetch_data_from_api(url)

        @bind(document["fetch-all-btn"], "click")
        def fetch_all(ev):
            document["start-date"].value = ""
            document["end-date"].value = ""
            fetch_data_from_api("http://127.0.0.1:5000/api/data")

        def fetch_data_from_api(url):
            document["loading"].style.display = "flex"
            document["card-grid"].classList.add("hidden")
            document["error-message"].classList.add("hidden")
            
            req = ajax.Ajax()
            req.bind("complete", on_ajax_complete)
            req.open("GET", url, True)
            req.send()

        def on_ajax_complete(req):
            document["loading"].style.display = "none"
            
            if req.status == 200:
                try:
                    response = json.loads(req.text)
                    app_state["all_data"] = response.get("data", [])
                    document["card-grid"].classList.remove("hidden")
                    render_cards()
                except Exception as e:
                    err = document["error-message"]
                    err.innerHTML = f"JSON Parse Error: {str(e)}"
                    err.classList.remove("hidden")
            else:
                err = document["error-message"]
                err.innerHTML = "API Request Failed. Check your Quart Server."
                err.classList.remove("hidden")

        populate_tags()
        fetch_data_from_api("http://127.0.0.1:5000/api/data")
    </script>
</body>
</html>
